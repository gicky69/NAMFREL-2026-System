services:
  backend:
    build:
      context: ./backend
      dockerfile: app/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: npm run dev -- --host 0.0.0.0